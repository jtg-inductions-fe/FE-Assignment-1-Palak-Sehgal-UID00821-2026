<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- 1. Primary Page Title & SEO Meta Tags -->
        <title>Travlog - Travel Top Destination of the World</title>
        <meta
            name="description"
            content="We always make our customer happy by providing as many choices as possible. Discover top travel destinations and dream locations with Travlog."
        />
        <meta
            name="keywords"
            content="travel, holiday packages, luxury hotels, airlines, travel destinations, travlog"
        />
        <meta name="author" content="Travlog" />
        <meta name="theme-color" content="#5d50c6" />

        <!-- 2. Favicons & Multi-device Icons -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/icons/travlog-logo-header.svg"
        />
        <link
            rel="apple-touch-icon"
            href="/assets/icons/travlog-logo-header.svg"
        />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- 3. Open Graph (OG) Metadata (Facebook, LinkedIn, Discord) -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Travlog - Travel Top Destination of the World"
        />
        <meta
            property="og:description"
            content="We always make our customer happy by providing as many choices as possible. Discover top travel destinations and dream locations with Travlog."
        />
        <meta
            property="og:image"
            content="%VITE_SITE_URL%/assets/images/sea-view-desktop.png"
        />
        <meta property="og:site_name" content="Travlog" />
        <meta property="og:locale" content="en_US" />

        <!-- 4. Twitter Cards Metadata (X / Twitter) -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Travlog - Travel Top Destination of the World"
        />
        <meta
            name="twitter:description"
            content="We always make our customer happy by providing as many choices as possible. Discover top travel destinations and dream locations with Travlog."
        />
        <meta
            name="twitter:image"
            content="%VITE_SITE_URL%/assets/images/sea-view-desktop.png"
        />

        <!-- Stylesheets -->
        <link rel="stylesheet" href="/src/styles/main.scss" />
    </head>
    <body>
        <span class="glow-bg-pink" aria-hidden="true"></span>
        <header class="header">
            <div class="header__container container">
                <!-- Toggle Button-->
                <button
                    class="header__toggle"
                    type="button"
                    aria-label="Toggle Navigation"
                    aria-expanded="false"
                >
                    <i class="icon-hamburger header__toggle-icon"></i>
                </button>

                <!-- Brand Logo -->
                <a href="/" class="header__logo">
                    <img
                        src="/assets/icons/travlog-logo-header.svg"
                        alt="Company Logo"
                        class="header__logo-img"
                    />
                </a>

                <!-- Navigation Menu -->
                <nav class="header__nav" id="primary-navigation">
                    <ul class="header__nav-list">
                        <li class="header__nav-item">
                            <a
                                href="#home"
                                class="header__nav-link header__nav-link--active"
                                title="Go to Home Page"
                                >Home</a
                            >
                        </li>
                        <li class="header__nav-item">
                            <a
                                href="#discover"
                                class="header__nav-link"
                                title="Go to Discover Page"
                                >Discover</a
                            >
                        </li>
                        <li class="header__nav-item">
                            <a
                                href="#deals"
                                class="header__nav-link"
                                title="Go to Special Deals Page"
                                >Special Deals</a
                            >
                        </li>
                        <li class="header__nav-item">
                            <a
                                href="#contact"
                                class="header__nav-link"
                                title="Go to Contact Page"
                                >Contact</a
                            >
                        </li>
                    </ul>
                </nav>

                <!-- Auth Actions -->
                <div class="header__actions">
                    <a
                        href="#login"
                        class="btn btn--tertiary"
                        title="Go to Login Page"
                        >Log In</a
                    >
                    <a
                        href="#signup"
                        class="btn btn--primary"
                        title="Go to Signup Page"
                        >Sign Up</a
                    >
                </div>
            </div>
        </header>
        <main class="container">
            <section class="hero" id="home">
                <div class="hero__container">
                    <!-- Text & Action Content -->
                    <div class="hero__content">
                        <div class="tag-pill hero__pill">
                            <span>Explore the world!</span>
                            <i class="icon-bag" aria-hidden="true"></i>
                        </div>

                        <h1 class="hero__title">
                            Travel
                            <span class="hero__title-accent"
                                >top destination</span
                            >
                            of the world
                        </h1>

                        <p class="hero__description">
                            We always make our customer happy by providing as
                            many choices as possible
                        </p>

                        <div class="hero__actions">
                            <a
                                href="#get-started"
                                class="btn btn--primary hero__btn"
                                >Get Started</a
                            >
                            <a
                                href="#watch-demo"
                                class="btn btn--outline hero__btn-demo"
                            >
                                <span class="hero__demo-icon-wrapper">
                                    <i
                                        class="icon-watch"
                                        aria-hidden="true"
                                    ></i>
                                </span>
                                <span>Watch Demo</span>
                            </a>
                        </div>
                    </div>

                    <!-- Graphic / Image Gallery Grid -->
                    <div class="hero__gallery">
                        <img
                            src="/assets/icons/bg-globe-map.svg"
                            alt="BG Globle Image"
                            aria-hidden="true"
                            class="hero__globe-bg"
                        />
                        <div class="hero__card hero__card--1">
                            <img
                                src="/assets/images/sea-view-mobile.png"
                                alt="Ocean view resort"
                                class="hero__img"
                            />
                            <!-- Floating UI Accents & Badges -->
                            <div class="floating-icon hero__badge-send">
                                <span class="icon-paper-plane"
                                    ><span class="path1"></span
                                    ><span class="path2"></span
                                ></span>
                            </div>
                        </div>
                        <div class="hero__card hero__card--2">
                            <img
                                src="/assets/images/mountain-view-girl-mobile.png"
                                alt="Hiking top mountain"
                                class="hero__img"
                            />
                        </div>
                        <div class="hero__card hero__card--3">
                            <img
                                src="/assets/images/traveller-girl-mobile.png"
                                alt="Traveler with backpack"
                                class="hero__img"
                            />
                        </div>

                        <div
                            class="floating-icon floating-icon--orange hero__badge-user"
                        >
                            <span class="icon-user">
                                <span class="path1"></span>
                                <span class="path2"></span>
                            </span>
                        </div>

                        <div class="badge-floating hero__badge-location">
                            <i class="icon-location" aria-hidden="true"></i>
                            <span>Top Places</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="/src/script/index.js"></script>
    </body>
</html>
