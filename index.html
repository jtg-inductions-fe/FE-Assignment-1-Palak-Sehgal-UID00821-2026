<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- 1. Primary Page Title & SEO Meta Tags -->
        <title>Travlog - Travel Top Destination of the World</title>
        <meta
            name="description"
            content="We always make our customer happy by providing as many choices as possible. Discover top travel destinations and dream locations with Travlog."
        />
        <meta
            name="keywords"
            content="travel, holiday packages, luxury hotels, airlines, travel destinations, travlog"
        />
        <meta name="author" content="Travlog" />
        <meta name="theme-color" content="#5d50c6" />

        <!-- 2. Favicons & Multi-device Icons -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/icons/travlog-logo-header.svg"
        />
        <link
            rel="apple-touch-icon"
            href="/assets/icons/travlog-logo-header.svg"
        />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- 3. Open Graph (OG) Metadata (Facebook, LinkedIn, Discord) -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Travlog - Travel Top Destination of the World"
        />
        <meta
            property="og:description"
            content="We always make our customer happy by providing as many choices as possible. Discover top travel destinations and dream locations with Travlog."
        />
        <meta
            property="og:image"
            content="/assets/images/sea-view-desktop.png"
        />
        <meta property="og:site_name" content="Travlog" />
        <meta property="og:locale" content="en_US" />

        <!-- 4. Twitter Cards Metadata (X / Twitter) -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Travlog - Travel Top Destination of the World"
        />
        <meta
            name="twitter:description"
            content="We always make our customer happy by providing as many choices as possible. Discover top travel destinations and dream locations with Travlog."
        />
        <meta
            name="twitter:image"
            content="/assets/images/sea-view-desktop.png"
        />

        <!-- Stylesheets -->
        <link rel="stylesheet" href="/src/styles/main.scss" />
    </head>
    <body>
        <main class="container">
            <!-- 1. Buttons Usage -->
            <div>Travlog</div>
        </main>

        <script type="module" src="/src/script/index.js"></script>
    </body>
</html>
